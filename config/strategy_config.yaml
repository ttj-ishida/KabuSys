# strategy_config.yaml — 売買戦略パラメータ
# 変更後は次回 run_strategy_signal.py 実行から反映される（再起動不要）

strategy:
  # ファクター重み（合計が 1.0 でない場合、generate_signals() 内で自動スケールされる）
  weights:
    momentum: 0.40
    value: 0.20
    volatility: 0.15
    liquidity: 0.15
    news: 0.10
  # BUY シグナル生成の final_score 閾値
  threshold: 0.60
  # ストップロス閾値（終値 / avg_price - 1 がこれ以下で SELL）
  stop_loss_rate: -0.08
  # 最低保有営業日数（スコア低下による SELL を抑制する日数）
  min_holding_days: 5
  # 最大保有営業日数（これを超えると time_exit SELL を発動）
  max_holding_days: 60
  # トレーリングストップの ATR 乗数
  trailing_stop_atr_mult: 2.0
  # 同一銘柄の再エントリー禁止期間（営業日数）
  reentry_cooldown_days: 5
  # ギャップアップ閾値（この比率を超えた寄り高は BUY 抑制）
  gap_up_threshold: 0.05
  # ギャップダウン閾値（この比率以下の寄り安は BUY 抑制）
  gap_down_threshold: -0.03

value_score:
  # バリュースコア計算の重み（合計 1.0）
  weights:
    per: 0.50
    pbr: 0.30
    div_yield: 0.20
  # 正規化基準値
  normalization:
    per_mid: 20.0
    pbr_mid: 1.5
    div_yield_max: 3.0

sector:
  # 上位セクター銘柄への final_score 加算量（≥ 0）
  boost: 0.03
  # 上位・下位セクターの区切り割合（0 < x < 1）
  quartile: 0.25

regime:
  # TOPIX 200MA 乖離率がこの値以下で地合い悪化と判定（負値）
  topix_drawdown_threshold: -0.15
  # 地合い悪化時の size_multiplier（0 < x ≤ 1）
  topix_size_multiplier_bear: 0.5
