[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kabusys"
version = "0.1.0"
# テスト済み・推奨: Python 3.11 / 3.12 (CI は 3.11)
# Python 3.13 は依存パッケージの wheel 未対応のため非推奨
requires-python = ">=3.10,<3.13"
# 正確なバージョンは requirements.txt で管理。
# pip install -r requirements.txt && pip install -e . --no-deps を推奨。
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "duckdb>=1.1,<2",
    "pyarrow>=15",
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
    "pyyaml>=6.0,<7",
    "defusedxml>=0.7,<1",
    "openai>=1.0,<2",
    "httpx>=0.27,<1",
    "psutil>=5.9,<7",
]

[project.optional-dependencies]
monitoring = ["streamlit>=1.32,<2"]
dev = ["pytest>=8.0,<9", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
