[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kabusys"
version = "0.1.0"
# 対応: Python 3.11 以上。運用・CI は Python 3.13
requires-python = ">=3.11"
# 正確なバージョンは constraints.txt で固定。
# pip install -c constraints.txt -r requirements.txt && pip install -e . --no-deps を推奨。
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "duckdb>=1.1,<2",
    "pyarrow>=15",
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
    "pyyaml>=6.0,<7",
    "defusedxml>=0.7,<1",
    "openai>=1.0,<2",
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
monitoring = ["streamlit>=1.32,<2"]
dev = ["pytest>=8.0,<10", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
